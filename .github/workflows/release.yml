name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS DMGs
    runs-on: macos-14

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Build arm64 DMG
        run: BUILD_ARCHS="arm64" ARCH_LABEL="arm64" ./Scripts/make-dmg.sh

      - name: Build universal DMG
        run: BUILD_ARCHS="arm64 x86_64" ARCH_LABEL="universal" ./Scripts/make-dmg.sh

      - name: Verify app signatures
        run: |
          codesign --verify --deep --strict --verbose=2 .build/app/CodexBarLite.app
          file .build/app/CodexBarLite.app/Contents/MacOS/CodexBarLite

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: CodexBarLite-DMGs
          path: .build/dist/*.dmg

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: .build/dist/*.dmg
          body: |
            Unsigned, not notarized macOS build.

            Install:
            1. Open the DMG and drag CodexBarLite.app to Applications.
            2. Remove quarantine:

               ```sh
               xattr -rd com.apple.quarantine /Applications/CodexBarLite.app
               ```

            Artifacts:
            - `arm64`: Apple Silicon only.
            - `universal`: Apple Silicon and Intel.
